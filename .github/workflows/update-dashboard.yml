name: Update stock pattern dashboard

on:
  push:
    branches: [master]
  schedule:
    # 08:00 Asia/Seoul on weekdays is 23:00 UTC on the previous day.
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python scanner.py

      - name: Commit refreshed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.md reports/latest.json
          git diff --cached --quiet || git commit -m "Update daily scan results"
          git push

      - uses: actions/configure-pages@v5
      - name: Assemble public dashboard
        run: |
          mkdir -p site/reports
          cp index.html app.js styles.css site/
          cp reports/latest.md reports/latest.json site/reports/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
